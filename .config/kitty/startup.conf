new_tab ocean-network-express
layout splits

# Start the container once, then let each window wait for it before launching.
launch --type=background fish -c 'docker start 8c >/tmp/kitty-docker-8c.log 2>&1 || true'

launch --var window=first --title "bind-ods" fish -c '~/.config/kitty/wait-for-docker-8c.sh && bind-ods'
launch --location=vsplit --title "backend" fish -c '~/.config/kitty/wait-for-docker-8c.sh && cd /home/doannc/github/ocean-network-express/backend && nvm use && pnpm install && pnpm start:dev'
launch --location=hsplit --title "bff" fish -c '~/.config/kitty/wait-for-docker-8c.sh && cd /home/doannc/github/ocean-network-express/bff && nvm use && pnpm install && pnpm start:dev'
focus_matching_window var:window=first
launch --location=hsplit --title "web" fish -c '~/.config/kitty/wait-for-docker-8c.sh && cd /home/doannc/github/ocean-network-express/web && nvm use && pnpm install && pnpm dev'
